# docker compose up --build        ->  API on :8000, demo UI on :8501
services:
  api:
    image: multiseries-forecast:latest
    build:
      context: .
      args:
        PRELOAD_CHRONOS: "1"          # "0" skips the weight download (global model only; chronos -> 503)
        CHRONOS_REVISION: "main"      # pin to the exact commit hash you validated
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 12
  ui:
    image: multiseries-forecast:latest     # same image, different command
    command: streamlit run demo/streamlit_app.py --server.port 8501 --server.address 0.0.0.0
    environment:
      API_URL: http://api:8000
    ports: ["8501:8501"]
    depends_on:
      api:
        condition: service_healthy
